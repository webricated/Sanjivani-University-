<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Name Plate Design</title>

<style>
body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family: "Georgia", serif;
}

.nameplate{
    width:850px;
    height:230px;
    background: 
        linear-gradient(135deg,#d4af37,#f6e27a,#c5a028);
    border-radius:12px;
    padding:25px 40px;
    box-shadow: 
        0 8px 18px rgba(0,0,0,0.25),
        inset 0 2px 4px rgba(255,255,255,0.4),
        inset 0 -2px 6px rgba(0,0,0,0.2);
    position:relative;
    overflow:hidden;
}

/* subtle brushed texture */
.nameplate::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
    );
    mix-blend-mode:overlay;
}

.content{
    display:flex;
    height:100%;
    align-items:center;
}

.left-section{
    width:35%;
    text-align:center;
    border-right:3px solid rgba(120,0,0,0.6);
    padding-right:25px;
}

.logo{
    font-size:60px;
    font-weight:bold;
    color:#7a0000;
    text-shadow:
        1px 1px 0 #fff,
        -1px -1px 0 #b88a00,
        2px 2px 4px rgba(0,0,0,0.4);
}

.institute{
    margin-top:10px;
    font-size:14px;
    letter-spacing:1px;
    font-weight:bold;
    color:#7a0000;
}

.right-section{
    width:65%;
    padding-left:30px;
}

.name{
    font-size:38px;
    font-weight:bold;
    letter-spacing:2px;
    color:#7a0000;
    text-shadow:
        1px 1px 0 #fff,
        -1px -1px 0 #b88a00,
        3px 3px 6px rgba(0,0,0,0.4);
}

.designation{
    font-size:24px;
    margin-top:10px;
    font-weight:bold;
    color:#7a0000;
    text-shadow:
        1px 1px 0 #fff,
        2px 2px 4px rgba(0,0,0,0.3);
}

.qualification{
    font-size:20px;
    margin-top:6px;
    color:#7a0000;
    text-shadow:
        1px 1px 0 #fff,
        2px 2px 4px rgba(0,0,0,0.3);
}
</style>

</head>
<body>

<div class="nameplate">
    <div class="content">
        <div class="left-section">
            <div class="logo">S</div>
            <div class="institute">SANJIVANI GROUP OF INSTITUTES</div>
        </div>

        <div class="right-section">
            <div class="name">PROF. R. K. SHARMA</div>
            <div class="designation">Head of Department</div>
            <div class="qualification">M.Tech (Civil), Ph.D.</div>
        </div>
    </div>
</div>

</body>
</html>
